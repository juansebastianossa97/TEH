<!doctype html><html lang="es"><meta charset="utf-8"><title>Rendimiento de imágenes JSOP</title><h1>Prueba local del procesador de imágenes</h1><p>Selecciona archivos de ensayo. No se guardan ni publican.</p><input type="file" multiple accept="image/jpeg,image/png,image/webp"><pre role="status">Listo</pre><script type="module">import {runTask} from '/dev/tools/worker-client.js';document.querySelector('input').onchange=async e=>{let last=performance.now(),lag=0,ticks=0;const timer=setInterval(()=>{const now=performance.now();lag=Math.max(lag,now-last-16);last=now;ticks++},16),start=performance.now(),results=[];const out=document.querySelector('pre');try{for(const file of e.target.files){out.textContent='Procesando '+file.name;const r=await runTask('optimize',{file,kind:'photo'});results.push({file:file.name,input:file.size,output:r.blob.size,width:r.width,height:r.height})}out.textContent=JSON.stringify({elapsedMs:Math.round(performance.now()-start),maxTimerDelayMs:Math.round(lag),heartbeatTicks:ticks,results},null,2)}catch(error){out.textContent=error.message}finally{clearInterval(timer)}};</script></html>
